name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Experimental lanes never block the workflow, even if checkout or npm ci fails there.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [20, 22]
        experimental: [false]
        include:
          # Windows is untested by the project (README "Platform notes"); it reports but never blocks.
          - os: windows-latest
            node: 22
            experimental: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # test/cli.test.js spawns zsh to prove the prompt segment; the Ubuntu image ships without it.
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      # --ignore-scripts skips the Electron download and the native uiohook rebuild.
      # Tests are pure Node by design (see CLAUDE.md), so this is the whole toolchain.
      - run: npm ci --ignore-scripts
      - if: ${{ !matrix.experimental }}
        run: npm test
      - if: ${{ matrix.experimental }}
        shell: bash
        run: npm test || echo "::warning title=Windows is experimental::npm test failed on Windows. Not blocking; see README Platform notes."

  pack:
    name: pack (no binaries, no candidates)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: npm pack --dry-run must not ship binaries, candidates, experiments, evidence or preview tooling
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          if grep -E '(^|[[:space:]])helpers/listen([[:space:]]|$)|assets/candidates|experiments/|scripts/darshan-preview|scripts/preview-darshan\.js|docs/evidence|scripts/anim/|assets/anim/[^/]+/manifest\.json' pack.txt; then
            echo "tarball contains a compiled helper, artwork candidates, experiments, evidence, or preview tooling"; exit 1
          fi
          sheets=$(grep -cE 'assets/anim/[a-z]+/(walkin|idle|teach|farewell)\.webp' pack.txt)
          styles=$(node -p "require('./src/config').FIGURE_STYLES.length")
          if [ "$sheets" -ne $((styles * 4)) ] || ! grep -q 'assets/anim/manifest\.js' pack.txt || ! grep -q 'assets/card-sky\.webp' pack.txt; then
            echo "tarball must ship four sheets per figure style ($styles styles, found $sheets sheets), assets/anim/manifest.js and assets/card-sky.webp"; exit 1
          fi
