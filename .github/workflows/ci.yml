name: CI

on:
  push:
    branches: [main]
  pull_request:

# Supersede an in-flight run when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and production audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # Fail on a high or critical advisory in the shipped (production) dependencies only;
      # devDependencies (the Electron rebuild toolchain) are not shipped to users.
      - run: npm audit --omit=dev --audit-level=high

  test:
    name: test (ubuntu, node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      # test/cli.test.js spawns zsh to prove the prompt segment; the Ubuntu image ships without it.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      # --ignore-scripts skips the Electron download and the native uiohook rebuild.
      # Tests are pure Node by design (see CLAUDE.md), so this is the whole toolchain.
      - run: npm ci --ignore-scripts
      # Run with coverage measurement and a failing floor (see package.json test:coverage).
      # A PR that drops line/branch/function coverage below the threshold fails here.
      # Uses only Node's built-in coverage: no Electron download or native rebuild required.
      - run: npm run test:coverage

  pack:
    name: pack (no binaries, no candidates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: npm pack --dry-run must not ship binaries, candidates, experiments, evidence or preview tooling
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          if grep -E '(^|[[:space:]])helpers/listen([[:space:]]|$)|assets/candidates|experiments/|scripts/darshan-preview|scripts/preview-darshan\.js|scripts/review-with-claude\.sh|docs/claude-adversarial-review\.txt|docs/evidence|scripts/anim/|assets/anim/[^/]+/manifest\.json' pack.txt; then
            echo "tarball contains a compiled helper, artwork candidates, experiments, evidence, review-only tooling, or preview tooling"; exit 1
          fi
          # The non-MIT assets/data ship, so their terms notice must ship with them (criterion C13).
          if ! grep -qE '(^|[[:space:]/])LICENSE([[:space:]]|$)' pack.txt || ! grep -q 'LICENSE-ASSETS\.md' pack.txt; then
            echo "tarball must ship both LICENSE and LICENSE-ASSETS.md"; exit 1
          fi
          # The corpus ships with its provenance manifest, so the two never travel apart.
          if grep -q 'data/gita\.json' pack.txt && ! grep -q 'data/gita\.manifest\.json' pack.txt; then
            echo "tarball ships data/gita.json but not its data/gita.manifest.json"; exit 1
          fi
          sheets=$(grep -cE 'assets/anim/[a-z]+/(walkin|idle|teach|farewell)\.webp' pack.txt)
          styles=$(node -p "require('./src/config').FIGURE_STYLES.length")
          if [ "$sheets" -ne $((styles * 4)) ] || ! grep -q 'assets/anim/manifest\.js' pack.txt; then
            echo "tarball must ship four sheets per figure style ($styles styles, found $sheets sheets) and assets/anim/manifest.js"; exit 1
          fi
