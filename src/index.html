<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Krishna Companion</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="companion" aria-live="polite">
      <article class="card" aria-label="Krishna's next teaching">
        <p id="translation" class="translation"></p>
        <div class="rule" aria-hidden="true"><i></i><span>◆</span></div>
        <p id="meaning" class="meaning"></p>
        <footer>
          <button id="source" class="source" type="button"></button>
          <button id="dismiss" class="dismiss" type="button">Continue <span>↵</span></button>
        </footer>
        <div class="timer" aria-hidden="true"><i></i></div>
      </article>

      <div class="figure" title="Drag Kṛṣṇa to move him" aria-label="Drag Krishna to move the companion">
        <img src="../assets/krishna.png" alt="Kṛṣṇa as Arjuna's charioteer" draggable="false" />
      </div>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
