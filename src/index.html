<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Krishna Companion</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-phase="absent">
    <main class="companion" aria-label="Kṛṣṇa darshan">
      <div class="threshold" aria-hidden="true"></div>
      <article class="card" aria-label="Bhagavad-gītā reading" inert>
        <header class="heading">
          <span class="seal" aria-hidden="true">✧</span>
          <div><p class="eyebrow">A moment of darshan</p><h1>Bhagavad-gītā <em>As It Is</em></h1></div>
          <button id="dismiss" class="close" type="button" aria-label="End darshan" title="End darshan · Esc">×</button>
        </header>
        <p id="chapter" class="chapter"></p>
        <div id="messages" class="messages" aria-live="polite" aria-busy="false">
          <div class="typing" role="status" aria-label="Opening verse"><i></i><i></i><i></i></div>
          <section class="message verse-message" aria-label="Verse translation">
            <div class="message-label"><span id="reference"></span><span>Translation</span></div>
            <p id="translation" class="translation"></p>
            <button id="expand" class="expand" type="button" aria-expanded="false" aria-controls="translation purport">Read full verse &amp; purport</button>
          </section>
          <section id="purport" class="message purport-message" aria-label="Purport opening" hidden>
            <p class="message-label">Śrīla Prabhupāda · Purport opening</p>
            <p id="meaning" class="meaning"></p>
          </section>
        </div>
        <footer>
          <button id="source" class="source" type="button">Bhaktivedanta VedaBase ↗</button>
          <button id="next" class="next" type="button">Next verse <span aria-hidden="true">→</span></button>
        </footer>
        <p id="timing-note" class="timing-note"></p>
      </article>
      <div class="thought" aria-hidden="true"><i></i><i></i></div>
      <div class="presence">
        <div class="halo" aria-hidden="true"></div>
        <div class="figure" title="Drag to place the darshan" aria-label="Drag Krishna to move the darshan">
          <img src="../assets/krishna.png" alt="Kṛṣṇa as Arjuna's charioteer" draggable="false" />
          <canvas class="sprite" aria-hidden="true"></canvas>
        </div>
        <div class="presence-caption"><span>Kṛṣṇa</span><small id="session-note">One verse at a time</small></div>
      </div>
    </main>
    <script src="../assets/anim/manifest.js"></script>
    <script src="sprite-player.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
